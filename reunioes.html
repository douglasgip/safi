      </button>
      <a href="/" style="display:flex;align-items:center;text-decoration:none"><img src="/public/logo cheia.png" alt="SAFI" class="header-logo-full"></a>

  <div id="re-loading">Carregando…</div>

  <main class="main" id="re-main" style="display:none">
    <div class="fe-toolbar">
      <div>
        <h1>Reuniões e Decisões</h1>
        <div class="fe-toolbar-sub">Registre as reuniões e acompanhe o que ficou decidido: quem faz, até quando e em que pé está.</div>

      <button class="tab" data-tab="reunioes">Reuniões</button>

    <section id="tab-acoes">
      <div class="chips" id="chips"></div>
      <div class="panel">
        <div class="filters">
          <select class="fe-select" id="f-status" aria-label="Situação">

  <!-- Modal: reunião -->
  <div class="modal-overlay" id="reu-modal">
    <div class="modal-card wide">
      <div class="modal-title" id="reu-title">Nova reunião</div>
      <div class="modal-error" id="reu-error"></div>
      <div class="grid2">
        <div class="field"><label for="reu-titulo">Título</label><input id="reu-titulo" maxlength="140" placeholder="Ex.: Conselho — resultado de agosto"></div>
        <div class="grid2">
          <div class="field"><label for="reu-data">Data</label><input id="reu-data" type="date"></div>
          <div class="field"><label for="reu-tipo">Tipo</label><select id="reu-tipo"><option value="conselho">Conselho</option><option value="diretoria">Diretoria</option><option value="operacional">Operacional</option><option value="outra">Outra</option></select></div>
        </div>
      </div>
      <div class="field"><label for="reu-part">Participantes</label><input id="reu-part" maxlength="400" placeholder="Nomes separados por vírgula"></div>
      <div class="field"><label for="reu-pauta">Pauta</label><textarea id="reu-pauta" style="min-height:70px" placeholder="Assuntos a tratar"></textarea></div>
      <div class="field"><label for="reu-ata">Ata / resumo do que foi tratado</label><textarea id="reu-ata" class="tall" placeholder="O que foi discutido e decidido"></textarea></div>
      <div id="reu-acoes-wrap" style="display:none">
        <div class="field" style="margin-bottom:6px"><label>Ações e decisões desta reunião</label></div>

        <button class="btn-danger" id="reu-del" type="button" style="display:none">Excluir</button>
        <button class="btn-cancel" type="button" onclick="closeModal('reu-modal')">Fechar</button>
      </div>

  </div>

  <!-- Modal: ação -->
  <div class="modal-overlay" id="aca-modal">
    <div class="modal-card">
      <div class="modal-title" id="aca-title">Nova ação</div>
      <div class="modal-sub" id="aca-sub" style="display:none"></div>
      <div class="modal-error" id="aca-error"></div>
      <div class="field"><label for="aca-titulo">O que precisa ser feito</label><input id="aca-titulo" maxlength="200" placeholder="Ex.: Renegociar prazo com fornecedor X"></div>
      <div class="field"><label for="aca-detalhe">Detalhes (opcional)</label><textarea id="aca-detalhe" style="min-height:64px"></textarea></div>
      <div class="grid2">
        <div class="field"><label for="aca-resp">Responsável</label><select id="aca-resp"></select></div>
        <div class="field" id="aca-outro-wrap" style="display:none"><label for="aca-outro">Nome do responsável</label><input id="aca-outro" maxlength="80"></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="aca-prazo">Prazo</label><input id="aca-prazo" type="date"></div>
        <div class="field"><label for="aca-op">Operação</label><select id="aca-op"><option value="">Geral (Grupo)</option><option value="GIP">GIP Ecommerce</option><option value="Exposicao">Exposição Paulista</option><option value="ViaCloset">Via Closet</option></select></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="aca-reu">Reunião de origem</label><select id="aca-reu"></select></div>
        <div class="field"><label for="aca-status">Situação</label><select id="aca-status"><option value="aberta">Aberta</option><option value="em_andamento">Em andamento</option><option value="concluida">Concluída</option><option value="cancelada">Cancelada</option></select></div>
      </div>
      <div class="hist" id="aca-hist" style="display:none"></div>
      <div class="modal-actions">
        <button class="btn-primary" id="aca-save" type="button">Salvar</button>
        <button class="btn-danger" id="aca-del" type="button" style="display:none">Excluir</button>
        <button class="btn-cancel" type="button" onclick="closeModal('aca-modal')">Fechar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"><span class="toast-dot" id="toast-dot"></span><span id="toast-msg"></span></div>

  <script>
    const SUPABASE_URL  = 'https://ujsoqyhkebasszwtexmp.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc29xeWhrZWJhc3N6d3RleG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MzQwNDMsImV4cCI6MjEwMjAxMDA0M30.Pad05NiXhnDnOSdGLUnn_HYnKbrD19_hE6eeM9hln6c';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    SafiSidebar.mount('re', { active: 'reunioes', accent: { g1: '#38bdf8', g2: '#0284c7', text: '#082f49', adminRgb: '56,189,248', adminFg: '#7dd3fc' } });
    wireSidebarToggle('re');

    const OP_NOME = { GIP: 'GIP Ecommerce', Exposicao: 'Exposição Paulista', ViaCloset: 'Via Closet' };
    const ST_LABEL = { aberta: 'Aberta', em_andamento: 'Em andamento', concluida: 'Concluída', cancelada: 'Cancelada' };
    const TIPO_LABEL = { conselho: 'Conselho', diretoria: 'Diretoria', operacional: 'Operacional', outra: 'Outra' };
    const EVENTO_LABEL = { criada: 'Criada', status: 'Situação', prazo: 'Prazo', responsavel: 'Responsável', editada: 'Editada' };

    const g = id => document.getElementById(id);
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    const hoje = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
    const fmtD = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '—';
    const fmtDT = iso => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
    const ativa = a => a.status === 'aberta' || a.status === 'em_andamento';
    const vencida = a => ativa(a) && a.prazo && a.prazo < hoje();

    let me = null, podeEditar = false, ehAdmin = false;
    let usuarios = [], reunioes = [], acoes = [];
    let acaoAtual = null, reuAtual = null, chipSel = null;

    function openModal(id) { g(id).classList.add('open'); }
    function closeModal(id) { g(id).classList.remove('open'); }
    function showErr(id, msg) { const e = g(id); e.textContent = msg || ''; e.classList.toggle('visible', !!msg); }
    const reuNome = id => { const r = reunioes.find(x => x.id === id); return r ? r.titulo : null; };

    async function carregar() {
      const [r, a, u] = await Promise.all([
        sb.from('reunioes').select('*').order('data', { ascending: false }),
        sb.from('acoes').select('*').order('prazo', { ascending: true, nullsFirst: false }),
        sb.rpc('reunioes_usuarios'),
      ]);
      const err = r.error || a.error || u.error;
      if (err) throw err;
      reunioes = r.data || []; acoes = a.data || []; usuarios = u.data || [];
    }

    // ── Aba: ações ─────────────────────────────────────────────────────────
    function renderChips() {
      const mesIni = hoje().slice(0, 7);
      const n = {
        ativas: acoes.filter(ativa).length,
        vencidas: acoes.filter(vencida).length,
        mes: acoes.filter(a => a.status === 'concluida' && a.concluida_em && a.concluida_em.slice(0, 7) === mesIni).length,
        total: reunioes.length,
      };
      g('chips').innerHTML =
        '<button class="chip' + (g('f-status').value === 'ativas' ? ' on' : '') + '" data-set="ativas"><div class="chip-n">' + n.ativas + '</div><div class="chip-l">Em andamento</div></button>' +
        '<button class="chip warn' + (g('f-status').value === 'vencidas' ? ' on' : '') + '" data-set="vencidas"><div class="chip-n">' + n.vencidas + '</div><div class="chip-l">Vencidas</div></button>' +
        '<button class="chip" data-set="concluida"><div class="chip-n">' + n.mes + '</div><div class="chip-l">Concluídas no mês</div></button>' +
        '<button class="chip" data-tab="reunioes"><div class="chip-n">' + n.total + '</div><div class="chip-l">Reuniões registradas</div></button>';
    }

    function respFilterOptions() {
      const nomes = [...new Set(acoes.map(a => a.responsavel_nome))].sort((x, y) => x.localeCompare(y, 'pt-BR'));
      const cur = g('f-resp').value;
      g('f-resp').innerHTML = '<option value="">Todos os responsáveis</option>' + nomes.map(n => '<option value="' + esc(n) + '">' + esc(n) + '</option>').join('');
      g('f-resp').value = nomes.includes(cur) ? cur : '';
    }

    function renderAcoes() {
      renderChips();
      const fs = g('f-status').value, fr = g('f-resp').value, fo = g('f-op').value;
      let rows = acoes.filter(a => {
        if (fs === 'ativas' && !ativa(a)) return false;
        if (fs === 'vencidas' && !vencida(a)) return false;
        if (fs === 'concluida' && a.status !== 'concluida') return false;
        if (fs === 'cancelada' && a.status !== 'cancelada') return false;
        if (fr && a.responsavel_nome !== fr) return false;
        if (fo === '__geral' ? !!a.operacao : (fo && a.operacao !== fo)) return false;
        return true;
      });
      if (!rows.length) { g('tbl-acoes').innerHTML = '<tbody><tr><td class="muted" style="padding:28px;text-align:center">Nenhuma ação neste filtro.</td></tr></tbody>'; return; }
      g('tbl-acoes').innerHTML = '<thead><tr><th>Ação</th><th>Responsável</th><th>Operação</th><th>Prazo</th><th>Situação</th><th>Reunião</th></tr></thead><tbody>' +
        rows.map(a => '<tr class="click" data-acao="' + a.id + '"><td>' + esc(a.titulo) + (a.detalhe ? '<div class="sub">' + esc(a.detalhe.slice(0, 110)) + (a.detalhe.length > 110 ? '…' : '') + '</div>' : '') + '</td>' +
          '<td>' + esc(a.responsavel_nome) + '</td><td class="muted">' + (a.operacao ? OP_NOME[a.operacao] : 'Geral') + '</td>' +
          '<td class="' + (vencida(a) ? 'venc' : '') + '" style="white-space:nowrap">' + fmtD(a.prazo) + (vencida(a) ? ' · vencida' : '') + '</td>' +
          '<td><span class="st st-' + a.status + '">' + ST_LABEL[a.status] + '</span></td><td class="muted">' + esc(reuNome(a.reuniao_id) || '—') + '</td></tr>').join('') + '</tbody>';
    }

    // ── Aba: reuniões ──────────────────────────────────────────────────────
    function renderReunioes() {
      if (!reunioes.length) { g('re-cards').innerHTML = '<div class="empty" style="grid-column:1/-1">Nenhuma reunião registrada ainda.</div>'; return; }
      g('re-cards').innerHTML = reunioes.map(r => {
        const as = acoes.filter(a => a.reuniao_id === r.id);
        const ab = as.filter(ativa).length;
        return '<div class="re-card" data-reu="' + r.id + '"><div class="re-card-t">' + esc(r.titulo) + '</div>' +
          '<div class="re-card-m"><span class="tipo">' + TIPO_LABEL[r.tipo] + '</span>' + fmtD(r.data) + (r.participantes ? ' · ' + esc(r.participantes.slice(0, 70)) + (r.participantes.length > 70 ? '…' : '') : '') + '</div>' +
          (r.ata || r.pauta ? '<div class="re-card-p">' + esc((r.ata || r.pauta).slice(0, 200)) + '</div>' : '') +
          '<div class="re-card-c">' + (as.length ? as.length + ' ação(ões) · ' + ab + ' em andamento' : 'Sem ações registradas') + '</div></div>';
      }).join('');
    }

    function renderTudo() { respFilterOptions(); renderAcoes(); renderReunioes(); }

    // ── Modal: reunião ─────────────────────────────────────────────────────
    function abrirReuniao(id) {
      reuAtual = id ? reunioes.find(r => r.id === id) : null;
      showErr('reu-error', '');
      g('reu-title').textContent = reuAtual ? 'Reunião' : 'Nova reunião';
      g('reu-titulo').value = reuAtual ? reuAtual.titulo : '';
      g('reu-data').value = reuAtual ? reuAtual.data : hoje();
      g('reu-tipo').value = reuAtual ? reuAtual.tipo : 'conselho';
      g('reu-part').value = reuAtual ? (reuAtual.participantes || '') : '';
      g('reu-pauta').value = reuAtual ? (reuAtual.pauta || '') : '';
      g('reu-ata').value = reuAtual ? (reuAtual.ata || '') : '';
      ['reu-titulo', 'reu-data', 'reu-tipo', 'reu-part', 'reu-pauta', 'reu-ata'].forEach(x => { g(x).disabled = !podeEditar; });
      g('reu-save').style.display = podeEditar ? '' : 'none';
      g('reu-del').style.display = ehAdmin && reuAtual ? '' : 'none';
      g('reu-add-acao').style.display = podeEditar ? '' : 'none';
      renderReuAcoes();
      openModal('reu-modal');
    }
    function renderReuAcoes() {
      g('reu-acoes-wrap').style.display = reuAtual ? '' : 'none';
      if (!reuAtual) return;
      const as = acoes.filter(a => a.reuniao_id === reuAtual.id);
      g('reu-acoes').innerHTML = as.length ? as.map(a => '<div class="sub-item" data-acao="' + a.id + '"><span class="st st-' + a.status + '">' + ST_LABEL[a.status] + '</span><span class="t">' + esc(a.titulo) + '</span><span class="r">' + esc(a.responsavel_nome) + ' · ' + fmtD(a.prazo) + '</span></div>').join('') : '<div class="muted" style="font-size:12px">Nenhuma ação ainda.</div>';
    }
    g('reu-save').addEventListener('click', async () => {
      const titulo = g('reu-titulo').value.trim(), data = g('reu-data').value;
      if (!titulo) return showErr('reu-error', 'Informe o título da reunião.');
      if (!data) return showErr('reu-error', 'Informe a data.');
      const row = { titulo, data, tipo: g('reu-tipo').value, participantes: g('reu-part').value.trim() || null, pauta: g('reu-pauta').value.trim() || null, ata: g('reu-ata').value.trim() || null };
      const btn = g('reu-save'); btn.disabled = true;
      const q = reuAtual ? sb.from('reunioes').update(row).eq('id', reuAtual.id).select() : sb.from('reunioes').insert(row).select();
      const { data: out, error } = await q;
      btn.disabled = false;
      if (error) return showErr('reu-error', 'Não foi possível salvar: ' + error.message);
      showErr('reu-error', '');
      const saved = out && out[0];
      if (saved) { const i = reunioes.findIndex(r => r.id === saved.id); if (i >= 0) reunioes[i] = saved; else reunioes.unshift(saved); reunioes.sort((a, b) => b.data.localeCompare(a.data)); reuAtual = saved; g('reu-title').textContent = 'Reunião'; g('reu-del').style.display = ehAdmin ? '' : 'none'; }
      renderTudo(); renderReuAcoes();
      showToast('Reunião salva. Agora você pode adicionar as ações.', 'green');
    });
    g('reu-del').addEventListener('click', async () => {
      if (!reuAtual || !confirm('Excluir esta reunião? As ações vinculadas continuam, só perdem o vínculo.')) return;
      const { error } = await sb.from('reunioes').delete().eq('id', reuAtual.id);
      if (error) return showErr('reu-error', 'Não foi possível excluir: ' + error.message);
      reunioes = reunioes.filter(r => r.id !== reuAtual.id); acoes.forEach(a => { if (a.reuniao_id === reuAtual.id) a.reuniao_id = null; });
      closeModal('reu-modal'); renderTudo(); showToast('Reunião excluída.', 'green');
    });
    g('reu-add-acao').addEventListener('click', () => { if (reuAtual) abrirAcao(null, reuAtual.id); });

    // ── Modal: ação ────────────────────────────────────────────────────────
    function montarSelectResp(selId, selNome) {
      const opts = usuarios.map(u => '<option value="' + u.id + '">' + esc(u.nome) + (u.cargo ? ' — ' + esc(u.cargo) : '') + '</option>').join('');
      g('aca-resp').innerHTML = '<option value="">Selecione…</option>' + opts + '<option value="__outro">Outra pessoa (digitar nome)</option>';
      if (selId && usuarios.some(u => u.id === selId)) { g('aca-resp').value = selId; g('aca-outro').value = ''; }
      else if (selNome) { g('aca-resp').value = '__outro'; g('aca-outro').value = selNome; }
      else { g('aca-resp').value = ''; g('aca-outro').value = ''; }
      g('aca-outro-wrap').style.display = g('aca-resp').value === '__outro' ? '' : 'none';
    }
    g('aca-resp').addEventListener('change', () => { g('aca-outro-wrap').style.display = g('aca-resp').value === '__outro' ? '' : 'none'; });

    async function abrirAcao(id, reuId) {
      acaoAtual = id ? acoes.find(a => a.id === id) : null;
      showErr('aca-error', '');
      const souResp = !!acaoAtual && acaoAtual.responsavel_id === me.id;
      const pleno = podeEditar;                     // edita tudo
      const soStatus = !pleno && souResp;           // só mexe na situação
      g('aca-title').textContent = acaoAtual ? 'Ação' : 'Nova ação';
      g('aca-titulo').value = acaoAtual ? acaoAtual.titulo : '';
      g('aca-detalhe').value = acaoAtual ? (acaoAtual.detalhe || '') : '';
      montarSelectResp(acaoAtual ? acaoAtual.responsavel_id : null, acaoAtual ? acaoAtual.responsavel_nome : null);
      g('aca-prazo').value = acaoAtual ? (acaoAtual.prazo || '') : '';
      g('aca-op').value = acaoAtual ? (acaoAtual.operacao || '') : '';
      g('aca-reu').innerHTML = '<option value="">— nenhuma —</option>' + reunioes.map(r => '<option value="' + r.id + '">' + fmtD(r.data) + ' · ' + esc(r.titulo) + '</option>').join('');
      g('aca-reu').value = acaoAtual ? (acaoAtual.reuniao_id || '') : (reuId || '');
      g('aca-status').value = acaoAtual ? acaoAtual.status : 'aberta';
      ['aca-titulo', 'aca-detalhe', 'aca-resp', 'aca-outro', 'aca-prazo', 'aca-op', 'aca-reu'].forEach(x => { g(x).disabled = !pleno; });
      g('aca-status').disabled = !(pleno || soStatus);
      g('aca-save').style.display = (pleno || soStatus) ? '' : 'none';
      g('aca-del').style.display = ehAdmin && acaoAtual ? '' : 'none';
      const sub = g('aca-sub');
      sub.style.display = soStatus ? '' : 'none'; sub.textContent = soStatus ? 'Você é o responsável: pode atualizar a situação desta ação.' : '';
      const h = g('aca-hist'); h.style.display = 'none';
      openModal('aca-modal');
      if (acaoAtual) {
        const { data } = await sb.from('acoes_log').select('*').eq('acao_id', acaoAtual.id).order('created_at', { ascending: false });
        if (data && data.length) { h.innerHTML = '<b>Histórico</b><br>' + data.map(l => fmtDT(l.created_at) + ' — <b>' + esc(l.user_nome || '—') + '</b>: ' + (EVENTO_LABEL[l.evento] || l.evento) + (l.detalhe ? ' (' + esc(l.detalhe) + ')' : '')).join('<br>'); h.style.display = ''; }
      }
    }

    g('aca-save').addEventListener('click', async () => {
      let row;
      if (podeEditar) {
        const titulo = g('aca-titulo').value.trim();
        const rv = g('aca-resp').value;
        const nome = rv === '__outro' ? g('aca-outro').value.trim() : ((usuarios.find(u => u.id === rv) || {}).nome || '');
        if (!titulo) return showErr('aca-error', 'Descreva o que precisa ser feito.');
        if (!nome) return showErr('aca-error', 'Escolha o responsável.');
        row = { titulo, detalhe: g('aca-detalhe').value.trim() || null, responsavel_id: rv && rv !== '__outro' ? rv : null, responsavel_nome: nome,
          prazo: g('aca-prazo').value || null, operacao: g('aca-op').value || null, reuniao_id: g('aca-reu').value || null, status: g('aca-status').value };
      } else row = { status: g('aca-status').value };
      const btn = g('aca-save'); btn.disabled = true;
      const q = acaoAtual ? sb.from('acoes').update(row).eq('id', acaoAtual.id).select() : sb.from('acoes').insert(row).select();
      const { data: out, error } = await q;
      btn.disabled = false;
      if (error) return showErr('aca-error', 'Não foi possível salvar: ' + error.message);
      const saved = out && out[0];
      if (!saved) return showErr('aca-error', 'Sem permissão para alterar esta ação.');
      const i = acoes.findIndex(a => a.id === saved.id); if (i >= 0) acoes[i] = saved; else acoes.push(saved);
      closeModal('aca-modal'); renderTudo(); if (g('reu-modal').classList.contains('open')) renderReuAcoes();
      showToast('Ação salva.', 'green');
    });
    g('aca-del').addEventListener('click', async () => {
      if (!acaoAtual || !confirm('Excluir esta ação definitivamente? Prefira marcar como Cancelada para manter o histórico.')) return;
      const { error } = await sb.from('acoes').delete().eq('id', acaoAtual.id);
      if (error) return showErr('aca-error', 'Não foi possível excluir: ' + error.message);
      acoes = acoes.filter(a => a.id !== acaoAtual.id);
      closeModal('aca-modal'); renderTudo(); if (g('reu-modal').classList.contains('open')) renderReuAcoes();
      showToast('Ação excluída.', 'green');
    });

    // ── Eventos gerais ─────────────────────────────────────────────────────
    function setTab(t) {
      document.querySelectorAll('#tabs .tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
      g('tab-acoes').style.display = t === 'acoes' ? '' : 'none';
      g('tab-reunioes').style.display = t === 'reunioes' ? '' : 'none';
    }
    document.addEventListener('click', e => {
      const tab = e.target.closest('[data-tab]'); if (tab) return setTab(tab.dataset.tab);
      const set = e.target.closest('[data-set]'); if (set) { g('f-status').value = set.dataset.set; return renderAcoes(); }
      const a = e.target.closest('[data-acao]'); if (a) return abrirAcao(a.dataset.acao);
      const r = e.target.closest('[data-reu]'); if (r) return abrirReuniao(r.dataset.reu);
    });
    ['f-status', 'f-resp', 'f-op'].forEach(id => g(id).addEventListener('change', renderAcoes));
    document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('mousedown', e => { if (e.target === m) m.classList.remove('open'); }));

    async function init() {
      const { data } = await sb.auth.getSession();
      if (!data.session) return window.location.replace('/login');
      const { data: rows } = await sb.from('user_profiles').select('*').eq('id', data.session.user.id).limit(1);
      me = (rows && rows[0]) || null;
      if (!me || !(me.is_admin || me.can_reunioes === true || me.can_reunioes_editar === true)) return window.location.replace('/');
      me.id = data.session.user.id;
      ehAdmin = !!me.is_admin; podeEditar = ehAdmin || me.can_reunioes_editar === true;
      SafiSidebar.apply('re', me, { email: data.session.user.email, sb });
      try { await carregar(); } catch (err) { g('re-loading').textContent = 'Erro ao carregar: ' + err.message; return; }
      if (podeEditar) {
        g('re-actions').innerHTML = '<button class="btn-primary" id="btn-nova-acao" type="button" style="flex:0 0 auto;padding:11px 18px">+ Nova ação</button><button class="btn-ghost" id="btn-nova-reu" type="button">+ Nova reunião</button>';
        g('btn-nova-acao').addEventListener('click', () => abrirAcao(null));
        g('btn-nova-reu').addEventListener('click', () => abrirReuniao(null));
      }
      g('re-loading').style.display = 'none';
      g('re-main').style.display = 'block';
      renderTudo();
    }
    init();
  </script>
</body>
</html>
