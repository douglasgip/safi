<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAFI | Entrar</title>
  <link rel="icon" type="image/png" href="/public/favicon.png">
  <link rel="apple-touch-icon" href="/public/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#080b14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SAFI">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #080b14;
    }

    /* ── Fundo com gradiente animado ── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 20% 50%, #1a1060 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, #0d3058 0%, transparent 55%),
                  radial-gradient(ellipse at 60% 80%, #1a0a3d 0%, transparent 50%),
                  linear-gradient(135deg, #080b14 0%, #0d1022 50%, #080b14 100%);
    }

    /* Orbs flutuantes */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      will-change: transform;
      opacity: 0.18;
      animation: drift linear infinite;
      z-index: 0;
      pointer-events: none;
    }
    .orb1 { width: 500px; height: 500px; background: #7c3aed; top: -100px; left: -100px; animation-duration: 20s; }
    .orb2 { width: 400px; height: 400px; background: #1d4ed8; bottom: -80px; right: -80px; animation-duration: 25s; animation-delay: -8s; }
    .orb3 { width: 300px; height: 300px; background: #f59e0b; top: 40%; right: 10%; animation-duration: 30s; animation-delay: -15s; opacity: 0.08; }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      33%  { transform: translate(30px, -30px) scale(1.05); }
      66%  { transform: translate(-20px, 20px) scale(0.95); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* Grade sutil */
    .grid-overlay {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* ── Card central ── */
    .card-wrap {
      position: relative; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      gap: 32px; padding: 24px;
      animation: fadeUp 0.7s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo */
    .brand {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .brand-logo-full {
      height: 60px; width: auto; object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.5)) drop-shadow(0 2px 6px rgba(0,0,0,0.3));
    }

    /* Card */
    .card {
      width: 100%; max-width: 400px;
      background: rgba(15,23,42,0.7);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 32px 64px rgba(0,0,0,0.5),
        0 8px 24px rgba(0,0,0,0.3);
    }

    .card-title {
      font-size: 20px; font-weight: 700; color: #f1f5f9;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 13px; color: #64748b; margin-bottom: 32px;
    }

    /* Inputs */
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 12px; font-weight: 600; color: #94a3b8;
      margin-bottom: 7px; letter-spacing: 0.3px;
    }
    .field input {
      width: 100%; padding: 13px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #f1f5f9; font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 500;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .field input::placeholder { color: #475569; }
    .field input:focus {
      border-color: rgba(245,158,11,0.5);
      background: rgba(255,255,255,0.07);
      box-shadow: 0 0 0 3px rgba(245,158,11,0.12);
    }

    /* Botão 3D */
    .btn-wrap { margin-top: 8px; perspective: 800px; }
    .btn {
      width: 100%; padding: 15px 24px;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 40%, #d97706 100%);
      border: none; border-radius: 13px;
      color: #1a0a00; font-family: 'Inter', sans-serif;
      font-size: 15px; font-weight: 700; letter-spacing: 0.2px;
      cursor: pointer; position: relative;
      transform-style: preserve-3d;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow:
        0 6px 0 #92400e,
        0 10px 20px rgba(245,158,11,0.28),
        0 2px 4px rgba(0,0,0,0.3);
    }
    .btn::after {
      content: '';
      position: absolute; inset: 0; border-radius: 13px;
      background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 60%);
      pointer-events: none;
    }
    .btn:hover {
      box-shadow:
        0 8px 0 #92400e,
        0 14px 28px rgba(245,158,11,0.35),
        0 2px 4px rgba(0,0,0,0.3);
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow:
        0 2px 0 #92400e,
        0 4px 12px rgba(245,158,11,0.2),
        0 1px 2px rgba(0,0,0,0.2);
    }
    .btn:disabled {
      opacity: 0.6; cursor: not-allowed;
      transform: none;
      box-shadow: 0 4px 0 #92400e, 0 6px 14px rgba(245,158,11,0.18);
    }

    /* Loading spinner inline */
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #1a0a00;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Erro */
    .error-box {
      display: none;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px; padding: 12px 14px;
      color: #fca5a5; font-size: 13px; font-weight: 500;
      margin-bottom: 18px; line-height: 1.4;
    }
    .error-box.visible { display: block; animation: shake 0.4s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60%  { transform: translateX(-5px); }
      40%,80%  { transform: translateX(5px); }
    }

    /* Rodapé */
    .footer {
      font-size: 11px; color: #334155; text-align: center;
    }

    @media (max-width: 480px) {
      body { align-items: flex-start; overflow-y: auto; }
      .card-wrap { padding: 40px 16px 32px; }
      .card { padding: 28px 20px; border-radius: 18px; }
      .brand-logo-full { height: 48px; }
      .card-title { font-size: 18px; }
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="grid-overlay"></div>

  <div class="card-wrap">

    <div class="brand">
      <img src="/public/logo cheia.png" alt="SAFI" class="brand-logo-full">
    </div>

    <div class="card">
      <div class="card-title">Bem-vindo de volta</div>
      <div class="card-desc">Entre com suas credenciais para acessar o painel</div>

      <div class="error-box" id="errBox"></div>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <div style="position:relative">
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required style="padding-right:44px">
            <button type="button" id="togglePwd" tabindex="-1" style="position:absolute;right:0;top:0;height:100%;width:44px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#475569;transition:color 0.15s" aria-label="Mostrar senha">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="btn-wrap">
          <button type="submit" class="btn" id="submitBtn">Entrar</button>
        </div>
      </form>
    </div>

    <div class="footer">© 2026 Grupo Sacoman · Acesso restrito</div>

  </div>

  <script>
    const SUPABASE_URL = 'https://ujsoqyhkebasszwtexmp.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc29xeWhrZWJhc3N6d3RleG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MzQwNDMsImV4cCI6MjEwMjAxMDA0M30.Pad05NiXhnDnOSdGLUnn_HYnKbrD19_hE6eeM9hln6c';

    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

    // Se já estiver logado, redireciona
    sb.auth.getSession().then(({ data }) => {
      if (data.session) window.location.replace('/');
    });

    const form   = document.getElementById('loginForm');
    const btn    = document.getElementById('submitBtn');
    const errBox = document.getElementById('errBox');

    function showError(msg) {
      errBox.textContent = msg;
      errBox.className = 'error-box visible';
    }
    function hideError() {
      errBox.className = 'error-box';
    }
    function setLoading(on) {
      btn.disabled = on;
      btn.innerHTML = on
        ? '<span class="spinner"></span>Entrando...'
        : 'Entrar';
    }

    document.getElementById('togglePwd').addEventListener('click', () => {
      const inp = document.getElementById('password');
      const btn = document.getElementById('togglePwd');
      const isHidden = inp.type === 'password';
      inp.type = isHidden ? 'text' : 'password';
      btn.style.color = isHidden ? '#f59e0b' : '#475569';
      document.getElementById('eyeIcon').innerHTML = isHidden
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      setLoading(true);

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        setLoading(false);
        const msgs = {
          'Invalid login credentials': 'E-mail ou senha incorretos.',
          'Email not confirmed': 'E-mail ainda não confirmado.',
          'Too many requests': 'Muitas tentativas. Aguarde um momento.',
        };
        showError(msgs[error.message] || 'Falha no login. Verifique suas credenciais.');
      } else {
        window.location.replace('/');
      }
    });
  </script>

</body>
</html>
