    function tabela(b) {
      const al = b.al || [];
      return '<div class="scroll"><table class="t t-doc"><thead><tr>' + b.cols.map((c, i) => '<th' + (al[i] === 'r' ? ' class="r"' : '') + '>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
        b.rows.map(r => '<tr' + (r.tot ? ' class="tot"' : '') + '>' + (r.c || r).map((v, i) => '<td class="' + (al[i] === 'r' ? 'r' : '') + (b.como === i ? (r.falta ? ' falta' : ' como') : '') + '">' + v + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
    }
    function bloco(b) {
      if (b.t === 'sec') return '<div class="sec-t">' + b.v + '</div>';
      if (b.t === 'sub') return '<div class="sub-t">' + b.v + '</div>';
      if (b.t === 'formula') return '<div class="formula"><b>Fórmula:</b> ' + b.v + '</div>';
      if (b.t === 'txt') return '<div class="txt">' + b.v + '</div>';
      if (b.t === 'chave') return '<div class="chave">' + b.v + '</div>';
      if (b.t === 'ul') return '<ul class="lst">' + b.v.map(x => '<li>' + x + '</li>').join('') + '</ul>';
      if (b.t === 'ol') return '<ol class="lst">' + b.v.map(x => '<li>' + x + '</li>').join('') + '</ol>';
      if (b.t === 'tab') return tabela(b);
      return '';
    }
    function abrir(i) {
      document.querySelectorAll('#tabs .tab').forEach((t, k) => t.classList.toggle('active', k === i));
      const d = DOCS[i];
      g('doc').innerHTML = '<div class="doc-h">' + d.titulo + '</div><div class="doc-s">' + d.sub + '</div>' + d.blocos.map(bloco).join('');
    }
    function montar() {
      g('tabs').innerHTML = DOCS.map((d, i) => '<button class="tab" data-i="' + i + '">' + d.aba + '</button>').join('');
      g('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) abrir(+b.dataset.i); });
      abrir(0);
    }
    (async function init() {
      const { data } = await sb.auth.getSession();
      if (!data.session) return window.location.replace('/login');
      const { data: rows } = await sb.from('user_profiles').select('*').eq('id', data.session.user.id).limit(1);
      const prof = (rows && rows[0]) || null;
      if (!prof || !(prof.is_admin || prof.can_dre !== false)) return window.location.replace('/');
      SafiSidebar.apply('tt', prof, { email: data.session.user.email, sb });
      montar();
      g('tt-loading').style.display = 'none';
      g('tt-main').style.display = 'block';
    })();
  </script>
